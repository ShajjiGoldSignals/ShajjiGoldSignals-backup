name: XAU Signal Scan

on:
  schedule:
    # Trigger ONCE per hour. GitHub heavily throttles */5 schedules on free tier and
    # silently skips most runs, so instead each job loops internally every 5 minutes
    # for ~55 minutes. One reliable trigger beats twelve unreliable ones.
    # Covers 7am-4pm PKT (02:00-11:00 UTC) and 8pm-11pm PKT (15:00-18:00 UTC).
    - cron: "0 2-11 * * *"
    - cron: "0 15-18 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Prevent overlapping hourly jobs from fighting over the same state.json
concurrency:
  group: xau-signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Continuous scan loop (every 5 min for ~55 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          END=$(( $(date +%s) + 55*60 ))
          ITER=0
          while [ "$(date +%s)" -lt "$END" ]; do
            ITER=$((ITER+1))
            echo "--- scan iteration $ITER at $(date -u '+%H:%M:%S UTC') ---"
            SCAN_ITERATION=$ITER python xau_bot.py || echo "scan iteration failed, continuing"

            # Commit state after each scan so signal numbering / TP-SL tallies survive.
            if ! git diff --quiet -- state.json 2>/dev/null; then
              git config user.name "xau-scanner-bot"
              git config user.email "actions@github.com"
              git add state.json
              git commit -m "Update signal state [skip ci]" || true
              git pull --rebase --autostash origin main || true
              git push || echo "push failed, will retry next iteration"
            fi

            # Stop if the next sleep would overrun our window.
            if [ $(( $(date +%s) + 300 )) -ge "$END" ]; then
              echo "window ending, exiting loop"
              break
            fi
            sleep 300
          done
          echo "Loop finished after $ITER scans."
